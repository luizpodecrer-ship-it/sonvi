<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Extrato de comissão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/sonvi.css?v=202611010315">
<!-- Extrato de comissão do consultor (database/068): extrato.html?e=<token>, sem login. Só o extrato daquele consultor,
     de um mês fechado. Com o nome da empresa comercial, nunca SONVI. "Baixar PDF" imprime a folha. -->
<style>
  body { display:block; min-height:100%; background:#eef1f6; color-scheme:light; }
  .ex { max-width:820px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:12px; }
  .ex-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; } .ex-top small { color:#6b6f7a; font-size:12px; }
  .ex-acoes { display:flex; gap:8px; flex-wrap:wrap; }
  .ex-folha { border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 12px 32px -12px rgba(16,24,40,.18); background:#fff; }
  .ex-estado { background:#fff; border-radius:12px; padding:28px; color:#15171c; } .ex-estado p { color:#4b4f5a; margin:8px 0 0; }
  .ex .btn { background:#fff; color:#15171c; border-color:rgba(21,23,28,.55); } .ex .btn.pri { background:#2b5fb5; border-color:#2b5fb5; color:#fff; }
  @media print { @page { size:A4; margin:10mm; } body { background:#fff; } .ex { padding:0; max-width:none; } .ex-top { display:none; } .ex-folha { box-shadow:none; border-radius:0; } }
</style>
</head>
<body>
<div class="ex">
  <div class="ex-top"><small>Página segura · sem login · vale só para este link</small><span class="ex-acoes" id="acoes" hidden><button class="btn pri" type="button" id="pdf">Baixar PDF</button></span></div>
  <main id="caixa" aria-live="polite"><div class="ex-estado"><b>Abrindo…</b></div></main>
</div>
<script src="js/config.js?v=202611010315"></script>
<script src="js/extrato-folha.js?v=202611010315"></script>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('e') || '', caixa = document.getElementById('caixa');
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const estado = (t, x) => { caixa.innerHTML = `<div class="ex-estado"><b style="font-size:17px">${t}</b><p>${x}</p></div>`; };
  if (!/^[0-9a-f-]{36}$/i.test(token)) return estado('Link incompleto', 'Confira se o link foi copiado inteiro.');
  fetch(window.SONVI_CONFIG.url + '/rest/v1/rpc/extrato_por_token', { method:'POST', headers:{ apikey:window.SONVI_CONFIG.key, 'Content-Type':'application/json' }, body:JSON.stringify({ p_token:token }) })
    .then(r => r.json().then(j => { if (!r.ok) throw new Error((j && j.message) || 'Não foi possível abrir.'); return j; }))
    .then(x => {
      if (!x) return estado('Link inválido', 'Este extrato não existe mais.');
      if (x.reaberto) return estado('Extrato em revisão', 'O mês foi reaberto para ajuste. Quando for fechado de novo, um novo extrato chega para você.');
      const m = String(x.mes); document.title = `Extrato de comissão · ${MESES[+m.slice(5) - 1]}/${m.slice(0, 4)}`;
      caixa.innerHTML = `<div class="ex-folha">${window.SONVI_EXTRATO.html(x)}</div>`;
      document.getElementById('acoes').hidden = false; document.getElementById('pdf').onclick = () => window.print();
    }).catch(e => estado('Não foi possível abrir', esc(e.message)));
})();
</script>
</body>
</html>
