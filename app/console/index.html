<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console SONVI</title>
<link rel="icon" type="image/svg+xml" href="/img/simbolo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Sora:wght@600&display=swap">
<!-- Console SONVI (painel do proprietário): endereço reservado em console.sonvi.com.br. Ainda em construção; a prévia aprovada fica no quadro de design. -->
<style>
  html, body { height:100%; margin:0; }
  body { background:#0a0b0d; color:#f5f6f8; font:16px/1.6 Manrope, -apple-system, "Segoe UI", sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  main { max-width:440px; display:flex; flex-direction:column; gap:18px; }
  .marca { display:flex; align-items:center; gap:12px; }
  .selo { border:1px solid rgba(255,255,255,.35); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; letter-spacing:.12em; }
  h1 { font:600 30px/1.2 Sora, Manrope, sans-serif; letter-spacing:-.02em; margin:0; }
  p { margin:0; color:#b9bfcb; }
</style>
</head>
<body>
<main>
  <div class="marca"><img src="/img/sonvi-branco.svg" width="141" height="32" alt="SONVI"><span class="selo">CONSOLE</span></div>
  <h1>Console em construção.</h1>
  <p>Este é o endereço do painel do proprietário do SONVI. Acesso restrito.</p>
</main>
</body>
</html>
