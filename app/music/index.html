<script>window.SONVI_APP = 'music';
// Volta do login do Spotify (Radar): guarda o código e limpa o endereço antes de o resto do sistema carregar
(function () { var p = new URLSearchParams(location.search);
  if (p.has('state') && (p.has('code') || p.has('error'))) { window.SPOTIFY_VOLTA = { code:p.get('code'), state:p.get('state'), error:p.get('error') }; history.replaceState(null, '', location.pathname + '#/radar'); } })();
</script>
