# Netlify publica só a pasta app/ (banco e documentos ficam fora do site)
[build]
  publish = "app"
  command = ""

# O navegador sempre confere se há versão nova da página e dos arquivos do sistema (evita o Safari mostrar versão antiga)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# A Head 14 (primeiro cliente) entra por sonvi.com.br/head14 (decidido em 20/10/2026). O endereço antigo leva para lá.
# Só a entrada muda: links já enviados de PI e proposta (teste.sonvi.com.br/pi.html?p=..., proposta.html?p=...) continuam abrindo.
[[redirects]]
  from = "https://teste.sonvi.com.br/"
  to = "https://sonvi.com.br/head14/"
  status = 301
  force = true

[[redirects]]
  from = "https://teste.sonvi.com.br/index.html"
  to = "https://sonvi.com.br/head14/"
  status = 301
  force = true

[[redirects]]
  from = "https://teste.sonvi.com.br/music/*"
  to = "https://sonvi.com.br/head14/music/"
  status = 301
  force = true

# Site de apresentação: sonvi.com.br mostra a landing page (app/site/); o sistema continua em teste.sonvi.com.br
[[redirects]]
  from = "https://www.sonvi.com.br/*"
  to = "https://sonvi.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sonvi.com.br/"
  to = "/site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://sonvi.com.br/index.html"
  to = "/site/index.html"
  status = 200
  force = true

# Console SONVI (painel do proprietário): console.sonvi.com.br mostra app/console/ e não aparece em buscadores
[[redirects]]
  from = "https://console.sonvi.com.br/"
  to = "/console/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://console.sonvi.com.br/index.html"
  to = "/console/index.html"
  status = 200
  force = true

[[headers]]
  for = "/console/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"

# Endereço de cada empresa (cliente do SONVI): sonvi.com.br/<empresa>/ abre o sistema e /<empresa>/music/ o Sonvi Music.
# Arquivos que existem de verdade (site/, music/, js/, img/...) continuam saindo direto; só o que não existe cai aqui.
# O Netlify trata /head14 e /head14/ como o mesmo endereço: não criar regra que acrescenta a barra (vira redirecionamento sem fim).
[[redirects]]
  from = "/:org/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:org/*"
  to = "/:splat"
  status = 200
